<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Med MindMaps</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3fbfa;
color:#173b40;
}

header{
background:linear-gradient(135deg,#087f8c,#10a7a1);
color:white;
padding:35px 20px;
text-align:center;
}

header h1{
margin:0 0 10px;
font-size:32px;
}

header p{
margin:0;
font-size:16px;
}

.container{
max-width:1000px;
margin:auto;
padding:25px 18px;
}

.search{
width:100%;
padding:15px;
border:1px solid #d5dddd;
border-radius:14px;
font-size:16px;
margin-bottom:18px;
}

.categories{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:25px;
}

.categories button{
border:0;
background:#d9eeee;
color:#17616a;
padding:10px 16px;
border-radius:20px;
font-size:14px;
cursor:pointer;
}

.categories button:hover{
background:#bce3e3;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:18px;
padding:22px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.icon{
font-size:42px;
margin-bottom:10px;
}

.card h2{
margin:5px 0 12px;
font-size:21px;
}

.description{
color:#617477;
line-height:1.8;
}

.price{
font-size:21px;
font-weight:bold;
color:#087f8c;
margin:18px 0;
}

.buy{
width:100%;
border:0;
background:#087f8c;
color:white;
padding:14px;
border-radius:12px;
font-size:17px;
cursor:pointer;
}

.buy:hover{
background:#066d77;
}

footer{
text-align:center;
padding:35px 15px;
color:#718083;
}

</style>
</head>

<body>

<header>

<h1>🧠 Med MindMaps</h1>

<p>
مایندمپ‌های پزشکی برای مرور سریع و مؤثر
</p>

</header>


<div class="container">

<input
class="search"
id="search"
type="text"
placeholder="🔎 جستجوی مایندمپ..."
oninput="showProducts()"
>


<div class="categories">

<button onclick="filterProducts('همه')">
همه
</button>

<button onclick="filterProducts('قلب')">
قلب
</button>

<button onclick="filterProducts('اورژانس')">
اورژانس
</button>

<button onclick="filterProducts('تنفس')">
تنفس
</button>

<button onclick="filterProducts('کودکان')">
کودکان
</button>

<button onclick="filterProducts('داروشناسی')">
داروشناسی
</button>

</div>


<div
class="products"
id="products">
</div>

</div>


<footer>

Med MindMaps © 2026

</footer>


<script>


const products = [

{

name:"مایندمپ آریتمی‌های قلبی",

category:"قلب",

description:
"مرور سریع و طبقه‌بندی‌شده آریتمی‌های مهم قلبی",

price:30000,

icon:"❤️"

},

{

name:"مایندمپ ACLS",

category:"اورژانس",

description:
"مرور سریع الگوریتم‌های ACLS",

price:30000,

icon:"🚑"

},

{

name:"مایندمپ ECG",

category:"قلب",

description:
"مرور نکات مهم تفسیر ECG",

price:30000,

icon:"📈"

},

{

name:"مایندمپ اورژانس‌های تنفسی",

category:"تنفس",

description:
"مرور سریع اورژانس‌های تنفسی",

price:30000,

icon:"🫁"

},

{

name:"مایندمپ انسداد راه هوایی کودکان",

category:"کودکان",

description:
"مرور تشخیص و درمان انسداد راه هوایی",

price:30000,

icon:"👶"

},

{

name:"مایندمپ داروهای اورژانس",

category:"داروشناسی",

description:
"مرور داروهای مهم و کاربردی اورژانس",

price:30000,

icon:"💊"

}

];


let currentCategory="همه";


function filterProducts(category){

currentCategory=category;

showProducts();

}


function showProducts(){

const search=
document.getElementById("search")
.value
.toLowerCase();


const container=
document.getElementById("products");


const filtered=
products.filter(product=>{

const matchesSearch=
product.name
.toLowerCase()
.includes(search);


const matchesCategory=
currentCategory==="همه"
||
product.category===currentCategory;


return matchesSearch &&
matchesCategory;

});


container.innerHTML=
filtered.map(product=>`

<div class="card">

<div class="icon">
${product.icon}
</div>

<h2>
${product.name}
</h2>

<p class="description">
${product.description}
</p>

<div class="price">
${product.price.toLocaleString("fa-IR")} تومان
</div>

<button
class="buy"
onclick="buyProduct('${product.name}')">

خرید مایندمپ

</button>

</div>

`).join("");

}


function buyProduct(name){

alert(
"🧠 ${name}\n\nپرداخت و دریافت فایل به‌زودی فعال می‌شود."
);

}


showProducts();

</script>

</body>
</html>
