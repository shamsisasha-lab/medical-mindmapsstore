<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Med MindMaps</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2fbfa;
    color:#123;
}
header{
    background:#087f8c;
    color:white;
    padding:30px 20px;
    text-align:center;
}
header h1{
    margin:0 0 10px;
    font-size:32px;
}
header p{
    margin:0;
}
.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}
.search{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    border:1px solid #ccc;
    border-radius:12px;
    font-size:16px;
    margin-bottom:20px;
}
.categories{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:20px;
}
.categories button{
    border:0;
    padding:10px 15px;
    border-radius:20px;
    background:#d5eeee;
    cursor:pointer;
}
.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}
.card{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}
.card h2{
    font-size:20px;
}
.price{
    color:#087f8c;
    font-size:20px;
    font-weight:bold;
}
.buy{
    width:100%;
    border:0;
    background:#087f8c;
    color:white;
    padding:13px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}
footer{
    text-align:center;
    padding:30px;
    color:#666;
}
</style>
</head>

<body>

<header>
<h1>🧠 Med MindMaps</h1>
<p>مایندمپ‌های پزشکی برای مرور سریع و مؤثر</p>
</header>

<div class="container">

<input
class="search"
id="search"
type="text"
placeholder="🔎 جستجوی مایندمپ..."
oninput="showProducts()"
>

<div class="categories">
<button onclick="filterProducts('همه')">همه</button>
<button onclick="filterProducts('قلب')">قلب</button>
<button onclick="filterProducts('اورژانس')">اورژانس</button>
<button onclick="filterProducts('تنفس')">تنفس</button>
<button onclick="filterProducts('کودکان')">کودکان</button>
<button onclick="filterProducts('داروشناسی')">داروشناسی</button>
</div>

<div class="products" id="products"></div>

</div>

<footer>
Med MindMaps © 2026
</footer>

<script>

const products = [

{
name:"مایندمپ ACLS",
category:"اورژانس",
description:"مرور سریع الگوریتم‌های ACLS",
price:30000
},

{
name:"مایندمپ آریتمی‌های قلبی",
category:"قلب",
description:"مرور جامع آریتمی‌های مهم",
price:30000
},

{
name:"مایندمپ ECG",
category:"قلب",
description:"مرور نکات مهم تفسیر ECG",
price:30000
},

{
name:"مایندمپ اورژانس‌های تنفسی",
category:"تنفس",
description:"مرور سریع اورژانس‌های تنفسی",
price:30000
},

{
name:"مایندمپ انسداد راه هوایی کودکان",
category:"کودکان",
description:"مرور تشخیص و درمان انسداد راه هوایی",
price:30000
},

{
name:"مایندمپ داروهای اورژانس",
category:"داروشناسی",
description:"مرور داروهای مهم و کاربردی اورژانس",
price:30000
}

];

let currentCategory="همه";

function filterProducts(category){

currentCategory=category;

showProducts();

}

function showProducts(){

const search=document.getElementById("search").value.toLowerCase();

const container=document.getElementById("products");

const filtered=products.filter(product=>{

const matchesSearch=
product.name.toLowerCase().includes(search);

const matchesCategory=
currentCategory==="همه" ||
product.category===currentCategory;

return matchesSearch && matchesCategory;

});

container.innerHTML=filtered.map(product=>`

<div class="card">

<h2>${product.name}</h2>

<p>${product.description}</p>

<p class="price">
${product.price.toLocaleString("fa-IR")} تومان
</p>

<button class="buy"
onclick="buyProduct('${product.name}')">
خرید مایندمپ
</button>

</div>

`).join("");

}

function buyProduct(name){

alert(
"خرید «"+name+"» به‌زودی فعال می‌شود."
);

}

showProducts();

</script>

</body>
  </html>
