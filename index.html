<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Med MindMaps</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3fbfa;
color:#173b40;
}

header{
background:linear-gradient(135deg,#087f8c,#10a7a1);
color:white;
padding:35px 20px;
text-align:center;
}

header h1{
margin:0 0 10px;
font-size:32px;
}

header p{
margin:0;
font-size:16px;
}

.container{
max-width:1000px;
margin:auto;
padding:25px 18px;
}

.search{
width:100%;
padding:15px;
border:1px solid #d5dddd;
border-radius:14px;
font-size:16px;
margin-bottom:18px;
}

.categories{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-bottom:25px;
}

.categories button{
border:0;
background:#d9eeee;
color:#17616a;
padding:10px 16px;
border-radius:20px;
font-size:14px;
cursor:pointer;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:18px;
padding:22px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.icon{
font-size:42px;
margin-bottom:10px;
}

.card h2{
margin:5px 0 12px;
font-size:21px;
}

.description{
color:#617477;
line-height:1.8;
}

.price{
font-size:21px;
font-weight:bold;
color:#087f8c;
margin:18px 0;
}

.buy{
width:100%;
border:0;
background:#087f8c;
color:white;
padding:14px;
border-radius:12px;
font-size:17px;
cursor:pointer;
}

.buy:hover{
background:#066d77;
}

.modal{
display:none;
position:fixed;
z-index:1000;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);
padding:20px;
}

.modal-content{
background:white;
max-width:500px;
margin:60px auto;
padding:25px;
border-radius:20px;
text-align:center;
}

.modal-content h2{
color:#087f8c;
}

.payment-box{
background:#f3fbfa;
padding:18px;
border-radius:15px;
margin:20px 0;
line-height:2;
}

.card-number{
font-size:20px;
font-weight:bold;
direction:ltr;
letter-spacing:1px;
}

.confirm{
display:block;
background:#087f8c;
color:white;
padding:14px;
border-radius:12px;
text-decoration:none;
margin-top:15px;
}

.close{
background:#eee;
border:0;
padding:10px 20px;
border-radius:10px;
cursor:pointer;
margin-top:10px;
}

footer{
text-align:center;
padding:35px 15px;
color:#718083;
}

</style>
</head>

<body>

<header>

<h1>🧠 Med MindMaps</h1>

<p>
مایندمپ‌های پزشکی برای مرور سریع و مؤثر
</p>

</header>


<div class="container">

<input
class="search"
id="search"
type="text"
placeholder="🔎 جستجوی مایندمپ..."
oninput="showProducts()"
>


<div class="categories">

<button onclick="filterProducts('همه')">همه</button>
<button onclick="filterProducts('قلب')">قلب</button>
<button onclick="filterProducts('اورژانس')">اورژانس</button>
<button onclick="filterProducts('تنفس')">تنفس</button>
<button onclick="filterProducts('کودکان')">کودکان</button>
<button onclick="filterProducts('داروشناسی')">داروشناسی</button>

</div>


<div
class="products"
id="products">
</div>

</div>


<!-- پنجره پرداخت -->

<div
class="modal"
id="paymentModal">

<div class="modal-content">

<h2>🧠 خرید مایندمپ</h2>

<h3 id="productName"></h3>

<div class="price">
۳۰٬۰۰۰ تومان
</div>

<div class="payment-box">

<strong>روش پرداخت: کارت‌به‌کارت</strong>

<br>

شماره کارت آزمایشی:

<div class="card-number">
6037-XXXX-XXXX-1234
</div>

<br>

به نام: صاحب حساب

</div>

<p>
پس از کارت‌به‌کارت، رسید پرداخت خود را نگه دارید.
</p>

<a
class="confirm"
href="#"
onclick="confirmPayment()">

✅ پرداخت را انجام دادم

</a>

<button
class="close"
onclick="closeModal()">

بستن

</button>

</div>

</div>


<footer>

Med MindMaps © 2026

</footer>


<script>

const products = [

{
name:"مایندمپ آریتمی‌های قلبی",
category:"قلب",
description:"مرور سریع و طبقه‌بندی‌شده آریتمی‌های مهم قلبی",
price:30000,
icon:"❤️"
},

{
name:"مایندمپ ACLS",
category:"اورژانس",
description:"مرور سریع الگوریتم‌های ACLS",
price:30000,
icon:"🚑"
},

{
name:"مایندمپ ECG",
category:"قلب",
description:"مرور نکات مهم تفسیر ECG",
price:30000,
icon:"📈"
},

{
name:"مایندمپ اورژانس‌های تنفسی",
category:"تنفس",
description:"مرور سریع اورژانس‌های تنفسی",
price:30000,
icon:"🫁"
},

{
name:"مایندمپ انسداد راه هوایی کودکان",
category:"کودکان",
description:"مرور تشخیص و درمان انسداد راه هوایی",
price:30000,
icon:"👶"
},

{
name:"مایندمپ داروهای اورژانس",
category:"داروشناسی",
description:"مرور داروهای مهم و کاربردی اورژانس",
price:30000,
icon:"💊"
}

];

let currentCategory="همه";


function filterProducts(category){

currentCategory=category;

showProducts();

}


function showProducts(){

const search=
document.getElementById("search")
.value
.toLowerCase();

const container=
document.getElementById("products");

const filtered=
products.filter(product=>{

const matchesSearch=
product.name
.toLowerCase()
.includes(search);

const matchesCategory=
currentCategory==="همه"
||
product.category===currentCategory;

return matchesSearch &&
matchesCategory;

});


container.innerHTML=
filtered.map(product=>`

<div class="card">

<div class="icon">
${product.icon}
</div>

<h2>
${product.name}
</h2>

<p class="description">
${product.description}
</p>

<div class="price">
${product.price.toLocaleString("fa-IR")} تومان
</div>

<button
class="buy"
onclick="buyProduct('${product.name}')">

خرید مایندمپ

</button>

</div>

`).join("");

}


function buyProduct(name){

document.getElementById("productName").innerText=name;

document.getElementById("paymentModal").style.display="block";

}


function closeModal(){

document.getElementById("paymentModal").style.display="none";

}


function confirmPayment(){

alert(
"✅ مرحله بعد:\n\nپس از پرداخت، رسید خود را برای فروشنده ارسال کنید.\n\nسیستم ارسال خودکار رسید در مرحله بعد فعال می‌شود."
);

}


showProducts();

</script>

</body>
</html>
